services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    ports:
      - "${APP_PORT}:${APP_PORT}"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://${APP_HOST}:${APP_PORT}/health" ]
      interval: 10s
      timeout: 2s
      retries: 5
    depends_on:
      redis:
        condition: service_started
      mongos:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully

  redis:
    image: redis:8.0-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  cfg1:
    image: mongo:8.0
    command: ["mongod", "--configsvr", "--replSet", "cfgReplSet", "--bind_ip_all", "--port", "27100"]
    volumes:
      - cfg1_data:/data/db

  shard1a:
    image: mongo:8.0
    command: ["mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27101"]
    volumes:
      - shard1a_data:/data/db

  shard1b:
    image: mongo:8.0
    command: ["mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27102"]
    volumes:
      - shard1b_data:/data/db

  shard1c:
    image: mongo:8.0
    command: ["mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27103"]
    volumes:
      - shard1c_data:/data/db

  shard2a:
    image: mongo:8.0
    command: ["mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27104"]
    volumes:
      - shard2a_data:/data/db

  shard2b:
    image: mongo:8.0
    command: ["mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27105"]
    volumes:
      - shard2b_data:/data/db

  shard2c:
    image: mongo:8.0
    command: ["mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27106"]
    volumes:
      - shard2c_data:/data/db

  mongos:
    image: mongo:8.0
    command: ["mongos", "--configdb", "cfgReplSet/cfg1:27100", "--bind_ip_all", "--port", "${MONGODB_PORT}"]
    depends_on:
      cfg1:
        condition: service_started
    ports:
      - "${MONGODB_PORT}:${MONGODB_PORT}"
    healthcheck:
      test: ["CMD", "mongosh", "--host", "localhost", "--port", "${MONGODB_PORT}", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongo-init:
    image: mongo:8.0
    env_file:
      - .env.local
    depends_on:
      cfg1:
        condition: service_started
      shard1a:
        condition: service_started
      shard1b:
        condition: service_started
      shard1c:
        condition: service_started
      shard2a:
        condition: service_started
      shard2b:
        condition: service_started
      shard2c:
        condition: service_started
      mongos:
        condition: service_started
    volumes:
      - ./mongo-cluster-init.sh:/scripts/mongo-cluster-init.sh:ro
    entrypoint: ["/bin/bash", "/scripts/mongo-cluster-init.sh"]
    restart: "no"

volumes:
  cfg1_data:
  shard1a_data:
  shard1b_data:
  shard1c_data:
  shard2a_data:
  shard2b_data:
  shard2c_data: